<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolidea Production Test</title><link rel="stylesheet" href="Style.css"><link rel="stylesheet" href="upgrade.css"></head><body><main style="max-width:1000px;margin:24px auto;padding:20px"><h1>Toolidea Professional Tool Checker</h1><p>Automated smoke test: every registered tool must have a render function and render without an exception. It also runs selected functional assertions. File operations still need real user-file tests.</p><button class="btn" id="run">Run full checker</button><strong id="sum" style="margin-left:12px">Ready</strong><div style="height:10px;background:#e2e8f0;border-radius:10px;margin:16px 0"><i id="bar" style="display:block;height:100%;width:0;background:#6956ff"></i></div><div id="out"></div><div id="sandbox" style="position:fixed;left:-10000px;top:-10000px;width:900px"></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="policies.js"></script><script src="app.js"></script><script src="production.js"></script><script src="enhancements.js"></script><script src="upgrade.js"></script><script>
(()=>{const out=document.getElementById('out'),bar=document.getElementById('bar'),sum=document.getElementById('sum'),box=document.getElementById('sandbox');document.getElementById('run').onclick=async()=>{out.innerHTML='';let keys=Object.keys(TOOLS),pass=0,fail=0;for(let i=0;i<keys.length;i++){let k=keys[i],t=TOOLS[k],ok=1,err='';try{if(!t||typeof t.render!=='function')throw Error('missing render');let c=document.createElement('div');box.innerHTML='';box.appendChild(c);t.render(c)}catch(e){ok=0;err=e.message||String(e)}let r=document.createElement('div');r.style.cssText='padding:8px;border-bottom:1px solid #e2e8f0;color:'+(ok?'#15803d':'#b91c1c');r.textContent=(ok?'✓ ':'✗ ')+k+' — '+(t.name||'Unnamed')+(err?' — '+err:'');out.appendChild(r);ok?pass++:fail++;bar.style.width=Math.round((i+1)/keys.length*100)+'%';await new Promise(r=>setTimeout(r,0))}sum.textContent=`${pass} passed / ${fail} failed / ${keys.length} total`;};})();
</script></body></html>
