name: Production readiness check
on:
  push:
    branches: [main, production-readiness]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js policies.js styles.css Style.css site.js ads.txt robots.txt SECURITY.md; do test -f "$f"; done
          grep -q 'id="hamburgerBtn"' index.html
          grep -q 'id="sidebar"' index.html
          grep -q 'id="toolContainer"' index.html
          grep -q 'src="app.js?v=' index.html
          grep -q 'src="site.js?v=' index.html
          grep -q 'href="styles.css?v=' index.html
          echo 'Required production files and references are present.'
      - name: Check for placeholder ad credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='production-check.yml' 'pub-XXXXXXXXXXXXXXXX\|ca-pub-XXXXXXXXXXXXXXXX' .; then
            echo 'ERROR: placeholder advertising credentials are present.'
            exit 1
          fi
          echo 'No advertising credential placeholders found.'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check site.js
          node --check policies.js
      - name: Check HTML structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          html=Path('index.html').read_text(encoding='utf-8')
          Parser().feed(html)
          for element in ('hamburgerBtn','sidebar','sidebarContent','toolTitle','toolDesc','toolContainer','cookieBanner','modalOverlay'):
              assert f'id="{element}"' in html, f'missing {element}'
          assert html.count('id="hamburgerBtn"') == 1
          assert html.count('id="sidebar"') == 1
          print('index.html parsed and required application IDs are unique.')
          PY
