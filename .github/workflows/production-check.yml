name: Production readiness check

on:
  push:
    branches: [main, production-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files and references
        shell: bash
        run: |
          set -euo pipefail
          test -f Index.html
          test -f app.js
          test -f policies.js
          test -f Style.css
          test -f styles.css
          test -f ads.txt
          test -f robots.txt
          test -f SECURITY.md
          grep -q 'href="styles.css"' Index.html
          grep -q 'src="policies.js"' Index.html
          grep -q 'src="app.js"' Index.html

      - name: Check for placeholder ad credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='production-check.yml' 'pub-XXXXXXXXXXXXXXXX\|ca-pub-XXXXXXXXXXXXXXXX' .; then
            echo 'Placeholder advertising credentials are still present. Configure real publisher IDs before production.'
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: node --check app.js

      - name: Check HTML structure
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          Parser().feed(Path('Index.html').read_text(encoding='utf-8'))
          print('Index.html parsed successfully')
          PY
