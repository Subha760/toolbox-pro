name: Production readiness check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Install browser for tool tests
        run: npx playwright install --with-deps chromium
      - name: Test all tool workflows
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - name: Photo service contract tests (no model inference)
        run: python -m unittest discover -s backend -p 'test_*.py'
      - name: Verify advertising configuration
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude=production-check.yml 'pub-XXXXXXXXXXXXXXXX\|ca-pub-XXXXXXXXXXXXXXXX' .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: toolinger-dist
          path: dist
