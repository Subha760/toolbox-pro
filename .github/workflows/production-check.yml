name: Production readiness check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify advertising configuration
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'pub-XXXXXXXXXXXXXXXX\|ca-pub-XXXXXXXXXXXXXXXX' .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: toolinger-dist
          path: dist
