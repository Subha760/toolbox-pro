name: Publish Toolinger update to Indus Appstore
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published signed Toolinger release to upload
        required: true
        default: v4.2.0
  workflow_run:
    workflows: [Publish signed Android release assets]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: toolinger-indus-release
  cancel-in-progress: false
jobs:
  prerequisites:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check store setup and action availability
        id: check
        env:
          INDUS_TOKEN: ${{ secrets.INDUS_APP_STORE_API_TOKEN }}
          FIRST_PUBLISHED: ${{ vars.INDUS_FIRST_PUBLISHED }}
        run: |
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          if [ "$FIRST_PUBLISHED" != 'true' ]; then
            echo 'Initial Indus publication is required. Publish io.toolinger.app once in the Developer Console, then set INDUS_FIRST_PUBLISHED=true.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$INDUS_TOKEN" ]; then
            echo 'Add the repository secret INDUS_APP_STORE_API_TOKEN from the Indus Developer Console.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! curl --fail --silent --show-error 'https://api.github.com/repos/indusappstore/appstore-release/git/ref/tags/v1' --output "$RUNNER_TEMP/indus-action-ref.json"; then
            echo 'The Marketplace action repository/tag is unavailable. No store upload was attempted. Verify the publisher repository before retrying.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
  publish:
    needs: prerequisites
    if: needs.prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signed public APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          tag=os.environ.get('RELEASE_TAG') or json.loads(subprocess.check_output(['gh','release','view','--json','tagName']))['tagName']
          if not re.fullmatch(r'v\d+\.\d+\.\d+',tag): raise SystemExit('Use a published stable Toolinger version tag.')
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--json','isDraft,isPrerelease']))
          if release['isDraft'] or release['isPrerelease']: raise SystemExit('Stable published releases only.')
          apk=f'Toolinger-{tag[1:]}.apk'
          subprocess.run(['gh','release','download',tag,'--pattern',apk,'--pattern','SHA256SUMS.txt','--dir','packages'],check=True)
          entries={line.split()[1]:line.split()[0] for line in Path('packages/SHA256SUMS.txt').read_text().splitlines()}
          if hashlib.sha256(Path('packages',apk).read_bytes()).hexdigest()!=entries.get(apk): raise SystemExit('Signed APK checksum mismatch.')
          Path('packages',apk).rename('packages/Toolinger-release.apk')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write(f'INDUS_RELEASE_NOTES=Toolinger {tag[1:]} — everyday tools and owner dashboard improvements.\n')
          PY
      - name: Upload signed public app update
        uses: indusappstore/appstore-release@v1
        with:
          file_path: packages/Toolinger-release.apk
          file_type: apk
          package_name: io.toolinger.app
          api_token: ${{ secrets.INDUS_APP_STORE_API_TOKEN }}
          release_notes: ${{ env.INDUS_RELEASE_NOTES }}
      - name: Record upload result
        run: echo 'Indus update upload completed. Check the Indus Developer Console for processing, review and publication status.' >> "$GITHUB_STEP_SUMMARY"
